<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>암기고래 - 스마트 영단어</title>
  <style>
    /* 기본 초기화 및 앱 스타일 */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, #0f0f1a 0%, #1a1a2e 60%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* 화면 전환용 컨테이너 */
    #app { padding-bottom: 40px; }
    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* 헤더 및 공통 UI */
    .header { padding: 48px 24px 24px; text-align: center; }
    .title { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #FF6B6B, #4ECDC4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .btn-list { padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }
    .list-item {
      background: linear-gradient(135deg, rgba(255,107,107,0.1), rgba(255,107,107,0.05));
      border: 1px solid rgba(255,107,107,0.2); border-radius: 18px; padding: 18px 20px;
      display: flex; align-items: center; gap: 16px; cursor: pointer; color: #fff; text-align: left;
    }

    /* 플래시카드 3D 뒤집기 효과 */
    .card-container { perspective: 1200px; width: 100%; max-width: 380px; margin: 0 auto; margin-top: 20px; }
    .card {
      position: relative; width: 100%; height: 260px; transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(.4,2,.6,1); cursor: pointer;
    }
    .card.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0; backface-visibility: hidden; border-radius: 24px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08);
    }
    .card-front { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
    .card-back { background: linear-gradient(135deg, rgba(255,107,107,0.1) 0%, #1a1a2e 100%); transform: rotateY(180deg); border-color: rgba(255,107,107,0.3); }
    
    /* 컨트롤 버튼 */
    .controls { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 40px; }
    .btn-icon { width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,0.08); border: none; color: #fff; font-size: 20px; cursor: pointer; }
    .btn-play { width: 64px; height: 64px; border-radius: 20px; background: #FF6B6B; border: none; color: #fff; font-size: 24px; cursor: pointer; box-shadow: 0 4px 20px rgba(255,107,107,0.4); }
  </style>
</head>
<body>

<div id="app">
  <div id="screen-home" class="screen active">
    <div class="header">
      <div style="font-size: 36px; margin-bottom: 4px;">📖</div>
      <h1 class="title">암기고래</h1>
      <p style="color: rgba(255,255,255,0.4); font-size: 13px; margin-top: 4px;">나만의 음성 지원 단어장</p>
    </div>
    <div class="btn-list">
      <button class="list-item" onclick="showScreen('screen-study')">
        <div style="font-size: 24px;">📚</div>
        <div style="flex: 1;">
          <div style="font-weight: 700; font-size: 16px;">기본 단어장 학습하기</div>
          <div style="color: rgba(255,255,255,0.4); font-size: 12px; margin-top: 2px;">터치하여 시작</div>
        </div>
      </button>
    </div>
  </div>

  <div id="screen-study" class="screen">
    <div style="padding: 40px 20px 12px; display: flex; align-items: center; gap: 12px;">
      <button onclick="stopAutoPlay(); showScreen('screen-home')" style="background: rgba(255,255,255,0.08); border: none; border-radius: 12px; padding: 8px 14px; color: #fff; cursor: pointer;">← 뒤로</button>
      <div style="flex: 1; text-align: center; font-weight: 700;">학습 모드</div>
      <div style="width: 50px;"></div> </div>

    <div class="card-container" onclick="toggleFlip()">
      <div id="flashcard" class="card">
        <div class="card-face card-front">
          <div style="font-size: 11px; letter-spacing: 3px; color: rgba(255,255,255,0.4); margin-bottom: 16px;">TAP TO FLIP</div>
          <div id="word-en" style="font-size: 32px; font-weight: 800;">Word</div>
          <div id="word-progress" style="font-size: 12px; color: rgba(255,255,255,0.3); margin-top: 8px;">1 / 10</div>
        </div>
        <div class="card-face card-back">
          <div id="word-ko" style="font-size: 24px; font-weight: 800; margin-bottom: 8px;">의미</div>
          <div style="height: 1px; width: 100%; background: rgba(255,107,107,0.3); margin: 10px 0;"></div>
          <div id="word-desc" style="font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.6; text-align: center; white-space: pre-line;">설명</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-icon" onclick="prevWord()">‹</button>
      <button id="btn-play-toggle" class="btn-play" onclick="toggleAutoPlay()">▶</button>
      <button class="btn-icon" onclick="nextWord()">›</button>
    </div>
    
    <div style="text-align: center; margin-top: 20px;">
        <button onclick="playCurrentAudio()" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 99px; padding: 8px 20px; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 13px;">
          🔊 현재 단어 발음 듣기
        </button>
    </div>
  </div>
</div>

<script>
  // 1. 데이터 (기존 데이터 재사용)
  const words = [
    { word: "Serendipity", meaning: "뜻밖의 행운", desc: "우연히 좋은 것을 발견하는 행운.\nEx) Finding that charming café was pure serendipity." },
    { word: "Ephemeral", meaning: "덧없는, 순간적인", desc: "매우 짧은 시간만 지속되는.\nEx) The ephemeral beauty of cherry blossoms." },
    { word: "Resilient", meaning: "회복력 있는", desc: "어려움에서 빠르게 회복하는 능력.\nEx) She is incredibly resilient despite hardships." }
  ];

  let currentIndex = 0;
  let isFlipped = false;
  let isPlaying = false;
  let autoPlayTimeout;
  let currentAudio = null;

  // 2. 오디오 재생 핵심 로직
  function playAudioFile(wordText, onEndedCallback) {
    if (currentAudio) {
      currentAudio.pause(); // 기존 오디오 정지
    }
    
    // 파일명 규칙 적용: 특수문자 제거, 소문자로 변환하여 .mp3 붙임 (예: Serendipity -> serendipity.mp3)
    const cleanWord = wordText.toLowerCase().replace(/[^a-z0-9]/g, '');
    const audioPath = `./audio/${cleanWord}.mp3`;
    
    currentAudio = new Audio(audioPath);
    
    currentAudio.play().then(() => {
      // 재생 성공 시
      if (onEndedCallback) {
        currentAudio.onended = onEndedCallback;
      }
    }).catch(err => {
      console.warn("오디오 파일을 찾을 수 없습니다:", audioPath);
      // 오디오 파일이 없더라도 자동 재생 사이클이 멈추지 않도록 강제로 다음 단계로 넘김
      if (onEndedCallback) setTimeout(onEndedCallback, 1500); 
    });
  }

  // 3. UI 업데이트 및 카드 조작 로직
  function updateCard() {
    const w = words[currentIndex];
    document.getElementById('word-en').innerText = w.word;
    document.getElementById('word-ko').innerText = w.meaning;
    document.getElementById('word-desc').innerText = w.desc;
    document.getElementById('word-progress').innerText = `${currentIndex + 1} / ${words.length}`;
    
    isFlipped = false;
    document.getElementById('flashcard').classList.remove('flipped');
  }

  function toggleFlip() {
    isFlipped = !isFlipped;
    const card = document.getElementById('flashcard');
    if (isFlipped) card.classList.add('flipped');
    else card.classList.remove('flipped');
  }

  function playCurrentAudio() {
    playAudioFile(words[currentIndex].word);
  }

  // 4. 네비게이션
  function nextWord() {
    stopAutoPlay();
    currentIndex = (currentIndex + 1) % words.length;
    updateCard();
  }
  function prevWord() {
    stopAutoPlay();
    currentIndex = (currentIndex - 1 + words.length) % words.length;
    updateCard();
  }

  // 5. 자동 재생 사이클 로직
  function runAutoPlayStep() {
    if (!isPlaying) return;

    updateCard(); // 다음 단어로 카드 갱신
    
    // 1단계: 영어 발음 오디오 재생
    playAudioFile(words[currentIndex].word, () => {
      if (!isPlaying) return;
      
      // 2단계: 오디오가 끝나면 0.5초 대기 후 카드 뒤집기
      autoPlayTimeout = setTimeout(() => {
        if (!isPlaying) return;
        toggleFlip();
        
        // 3단계: 뜻 확인 시간(2초) 부여 후 다음 단어로 넘어감
        autoPlayTimeout = setTimeout(() => {
            if (!isPlaying) return;
            currentIndex++;
            if (currentIndex >= words.length) currentIndex = 0; // 끝까지 가면 처음으로
            runAutoPlayStep(); // 다음 단어 루프 시작
        }, 2000); 
      }, 500);
    });
  }

  function toggleAutoPlay() {
    const btn = document.getElementById('btn-play-toggle');
    if (isPlaying) {
      stopAutoPlay();
    } else {
      isPlaying = true;
      btn.innerText = "⏹";
      btn.style.background = "#333";
      runAutoPlayStep(); // 사이클 시작
    }
  }

  function stopAutoPlay() {
    isPlaying = false;
    clearTimeout(autoPlayTimeout);
    if (currentAudio) currentAudio.pause();
    const btn = document.getElementById('btn-play-toggle');
    btn.innerText = "▶";
    btn.style.background = "#FF6B6B";
  }

  // 화면 전환 헬퍼 함수
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(id === 'screen-study') updateCard();
  }

  // 앱 시작 시 초기화
  updateCard();
</script>

</body>
</html>
