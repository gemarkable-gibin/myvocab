<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>암기고래 - 내 단어장</title>
  <style>
    /* 기존 스타일 유지 및 개선 */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #0f0f1a 0%, #1a1a2e 60%, #16213e 100%);
      color: #fff; min-height: 100vh; overflow-x: hidden;
    }
    #app { padding-bottom: 40px; }
    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .header { padding: 48px 24px 24px; text-align: center; }
    .title { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #FF6B6B, #4ECDC4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    /* 카드 디자인 */
    .card-container { perspective: 1200px; width: 100%; max-width: 360px; margin: 20px auto; }
    .card {
      position: relative; width: 100%; height: 280px; transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(.4,2,.6,1); cursor: pointer;
    }
    .card.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0; backface-visibility: hidden; border-radius: 24px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
    }
    .card-front { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
    .card-back { background: linear-gradient(135deg, rgba(255,107,107,0.15) 0%, #1a1a2e 100%); transform: rotateY(180deg); border-color: rgba(255,107,107,0.4); }
    
    /* 컨트롤러 */
    .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 30px; }
    .btn-icon { width: 56px; height: 56px; border-radius: 18px; background: rgba(255,255,255,0.08); border: none; color: #fff; font-size: 24px; cursor: pointer; }
    .btn-play { width: 68px; height: 68px; border-radius: 22px; background: #FF6B6B; border: none; color: #fff; font-size: 28px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,107,107,0.4); }
    
    /* 로딩 인디케이터 */
    #loading { position: fixed; top:0; left:0; width:100%; height:100%; background:#0f0f1a; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; }
  </style>
</head>
<body>

<div id="loading">
  <div style="font-size: 40px; margin-bottom: 20px;">🐋</div>
  <p>단어장 읽어오는 중...</p>
</div>

<div id="app">
  <div id="screen-home" class="screen active">
    <div class="header">
      <h1 class="title">암기고래</h1>
      <p style="color: rgba(255,255,255,0.4); margin-top: 8px;">내 CSV 파일 학습하기</p>
    </div>
    <div style="padding: 0 24px;">
      <button onclick="showScreen('screen-study')" style="width:100%; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:30px; color:#fff; cursor:pointer;">
        <div style="font-size:32px; margin-bottom:10px;">📖</div>
        <div style="font-weight:700; font-size:18px;">학습 시작하기</div>
        <div id="word-count-tag" style="font-size:13px; color:#4ECDC4; margin-top:5px;">로딩 중...</div>
      </button>
    </div>
  </div>

  <div id="screen-study" class="screen">
    <div style="padding: 40px 24px 10px; display: flex; align-items: center; justify-content: space-between;">
      <button onclick="stopAutoPlay(); showScreen('screen-home')" style="background:none; border:none; color:#aaa; font-size:16px;">← 홈으로</button>
      <div id="word-progress" style="font-size: 14px; color: #4ECDC4; font-weight:700;">1 / 0</div>
      <div style="width: 50px;"></div>
    </div>

    <div class="card-container" onclick="toggleFlip()">
      <div id="flashcard" class="card">
        <div class="card-face card-front">
          <div id="word-en" style="font-size: 36px; font-weight: 800; text-align:center;">Word</div>
        </div>
        <div class="card-face card-back">
          <div id="word-ko" style="font-size: 26px; font-weight: 800; color:#FF6B6B;">뜻</div>
          <div style="height: 1px; width: 40%; background: rgba(255,255,255,0.1); margin: 20px 0;"></div>
          <div id="word-desc" style="font-size: 15px; color: rgba(255,255,255,0.6); text-align: center; white-space: pre-line;">설명</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-icon" onclick="prevWord()">‹</button>
      <button id="btn-play-toggle" class="btn-play" onclick="toggleAutoPlay()">▶</button>
      <button class="btn-icon" onclick="nextWord()">›</button>
    </div>

    <div style="text-align: center; margin-top: 30px;">
        <button onclick="playCurrentAudio()" style="background: none; border: 1px solid rgba(255,255,255,0.2); border-radius: 99px; padding: 10px 24px; color: #aaa; font-size: 14px;">
          🔊 다시 듣기
        </button>
    </div>
  </div>
</div>

<script>
  let words = [];
  let currentIndex = 0;
  let isFlipped = false;
  let isPlaying = false;
  let autoPlayTimeout;
  let currentAudio = null;

  // 1. CSV 파일 읽어오기 (가장 핵심!)
  async function loadVocabCSV() {
    try {
      // 캐시 방지를 위해 랜덤 쿼리 추가
      const response = await fetch('vocab.csv?v=' + Math.random());
      const data = await response.text();
      
      const lines = data.split('\n').filter(line => line.trim() !== '');
      
      // 첫 줄(헤더) 제외하고 단어 추출
      const parsedWords = lines.slice(1).map(line => {
        // 쉼표로 구분하되 큰따옴표 안의 쉼표는 무시하는 정규식
        const cols = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
        return {
          word: cols[0]?.replace(/"/g, '').trim() || '',
          meaning: cols[1]?.replace(/"/g, '').trim() || '',
          desc: cols[2]?.replace(/"/g, '').trim() || ''
        };
      }).filter(item => item.word !== '');

      words = parsedWords;
      document.getElementById('word-count-tag').innerText = `총 ${words.length}개의 단어가 준비되었습니다.`;
      document.getElementById('loading').style.display = 'none';
      updateCard();
    } catch (error) {
      console.error("CSV 로드 실패:", error);
      alert("vocab.csv 파일을 찾을 수 없습니다. 깃허브에 파일을 올렸는지 확인해주세요.");
    }
  }

  // 2. 오디오 재생 (파일명 규칙: 소문자.mp3)
  function playAudioFile(wordText, onEndedCallback) {
    if (currentAudio) { currentAudio.pause(); }
    
    // 파일명 규칙: 소문자로 변환, 특수문자 제거
    const fileName = wordText.toLowerCase().replace(/[^a-z0-9]/g, '');
    const audioPath = `./audio/${fileName}.mp3`;
    
    currentAudio = new Audio(audioPath);
    currentAudio.play()
      .then(() => { if (onEndedCallback) currentAudio.onended = onEndedCallback; })
      .catch(() => {
        console.warn("오디오 없음:", audioPath);
        if (onEndedCallback) setTimeout(onEndedCallback, 1500);
      });
  }

  // 3. UI 업데이트
  function updateCard() {
    if (words.length === 0) return;
    const w = words[currentIndex];
    document.getElementById('word-en').innerText = w.word;
    document.getElementById('word-ko').innerText = w.meaning;
    document.getElementById('word-desc').innerText = w.desc;
    document.getElementById('word-progress').innerText = `${currentIndex + 1} / ${words.length}`;
    
    isFlipped = false;
    document.getElementById('flashcard').classList.remove('flipped');
  }

  function toggleFlip() {
    isFlipped = !isFlipped;
    document.getElementById('flashcard').classList.toggle('flipped', isFlipped);
  }

  function playCurrentAudio() {
    if (words[currentIndex]) playAudioFile(words[currentIndex].word);
  }

  function nextWord() {
    stopAutoPlay();
    currentIndex = (currentIndex + 1) % words.length;
    updateCard();
  }

  function prevWord() {
    stopAutoPlay();
    currentIndex = (currentIndex - 1 + words.length) % words.length;
    updateCard();
  }

  // 4. 자동 재생 루프
  function runAutoPlayStep() {
    if (!isPlaying) return;
    updateCard();
    
    // 영어 발음 -> 0.5초 대기 -> 카드 뒤집기 -> 2초 대기 -> 다음 단어
    playAudioFile(words[currentIndex].word, () => {
      if (!isPlaying) return;
      autoPlayTimeout = setTimeout(() => {
        if (!isPlaying) return;
        toggleFlip();
        autoPlayTimeout = setTimeout(() => {
          if (!isPlaying) return;
          currentIndex = (currentIndex + 1) % words.length;
          runAutoPlayStep();
        }, 2000);
      }, 500);
    });
  }

  function toggleAutoPlay() {
    isPlaying = !isPlaying;
    const btn = document.getElementById('btn-play-toggle');
    if (isPlaying) {
      btn.innerText = "⏹";
      btn.style.background = "#333";
      runAutoPlayStep();
    } else {
      stopAutoPlay();
    }
  }

  function stopAutoPlay() {
    isPlaying = false;
    clearTimeout(autoPlayTimeout);
    if (currentAudio) currentAudio.pause();
    document.getElementById('btn-play-toggle').innerText = "▶";
    document.getElementById('btn-play-toggle').style.background = "#FF6B6B";
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // 실행 시작
  loadVocabCSV();
</script>

</body>
</html>
