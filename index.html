<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>암기고래 - 스마트 단어장</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #0f0f1a 0%, #1a1a2e 60%, #16213e 100%);
      color: #fff; min-height: 100vh; overflow-x: hidden;
    }
    .screen { display: none; padding-bottom: 50px; }
    .screen.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* 헤더 */
    .header { padding: 40px 24px 20px; text-align: center; }
    .title { font-size: 26px; font-weight: 800; background: linear-gradient(135deg, #FF6B6B, #4ECDC4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    /* 챕터 리스트 디자인 */
    .chapter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 20px; }
    .chapter-card {
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px; padding: 20px; text-align: center; cursor: pointer; transition: 0.2s;
    }
    .chapter-card:active { transform: scale(0.95); background: rgba(255, 107, 107, 0.2); }
    .chapter-num { font-size: 20px; font-weight: 800; color: #FF6B6B; margin-bottom: 4px; }
    .chapter-info { font-size: 12px; color: rgba(255,255,255,0.4); }

    /* 학습 카드 */
    .card-container { perspective: 1200px; width: 90%; max-width: 340px; margin: 20px auto; }
    .card {
      position: relative; width: 100%; height: 280px; transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(.4,2,.6,1); cursor: pointer;
    }
    .card.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0; backface-visibility: hidden; border-radius: 24px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
    }
    .card-front { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
    .card-back { background: linear-gradient(135deg, rgba(78, 205, 196, 0.1) 0%, #1a1a2e 100%); transform: rotateY(180deg); border-color: rgba(78, 205, 196, 0.4); }
    
    .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 30px; }
    .btn-icon { width: 56px; height: 56px; border-radius: 18px; background: rgba(255,255,255,0.08); border: none; color: #fff; font-size: 24px; }
    .btn-play { width: 68px; height: 68px; border-radius: 22px; background: #FF6B6B; border: none; color: #fff; font-size: 28px; box-shadow: 0 4px 15px rgba(255,107,107,0.4); }

    #loading { position: fixed; inset: 0; background: #0f0f1a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
  </style>
</head>
<body>

<div id="loading">🐋<br>데이터 로딩 중...</div>

<div id="app">
  <div id="screen-home" class="screen active">
    <div class="header">
      <h1 class="title">암기고래</h1>
      <p id="total-count" style="color: rgba(255,255,255,0.4); margin-top: 8px;">단어를 불러오는 중...</p>
    </div>
    <div class="chapter-grid" id="chapter-list">
      </div>
  </div>

  <div id="screen-study" class="screen">
    <div style="padding: 30px 24px 10px; display: flex; align-items: center; justify-content: space-between;">
      <button onclick="stopAutoPlay(); showScreen('screen-home')" style="background:none; border:none; color:#aaa;">← 목록</button>
      <div id="word-progress" style="font-size: 14px; color: #4ECDC4; font-weight:700;">1 / 10</div>
      <div style="width: 40px;"></div>
    </div>

    <div class="card-container" onclick="toggleFlip()">
      <div id="flashcard" class="card">
        <div class="card-face card-front">
          <div id="word-en" style="font-size: 32px; font-weight: 800; text-align:center;">Word</div>
        </div>
        <div class="card-face card-back">
          <div id="word-ko" style="font-size: 24px; font-weight: 800; color:#4ECDC4;">뜻</div>
          <div style="height: 1px; width: 40%; background: rgba(255,255,255,0.1); margin: 20px 0;"></div>
          <div id="word-desc" style="font-size: 14px; color: rgba(255,255,255,0.5); text-align: center; white-space: pre-line;">설명</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-icon" onclick="prevWord()">‹</button>
      <button id="btn-play-toggle" class="btn-play" onclick="toggleAutoPlay()">▶</button>
      <button class="btn-icon" onclick="nextWord()">›</button>
    </div>
  </div>
</div>

<script>
  let allWords = [];
  let chapters = [];
  let currentChapterIdx = 0;
  let currentIndex = 0;
  let isFlipped = false;
  let isPlaying = false;
  let autoPlayTimeout;
  let currentAudio = new Audio(); // 오디오 객체 미리 생성 (권한 획득용)

  // 1. CSV 로드 및 챕터 나누기
  async function loadData() {
    try {
      const response = await fetch('vocab.csv?v=' + Date.now());
      const text = await response.text();
      const lines = text.split('\n').filter(l => l.trim() !== '');
      
      allWords = lines.slice(1).map(line => {
        const cols = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
        return {
          word: cols[0]?.replace(/"/g, '').trim() || '',
          meaning: cols[1]?.replace(/"/g, '').trim() || '',
          desc: cols[2]?.replace(/"/g, '').trim() || ''
        };
      }).filter(w => w.word !== '');

      // 10개씩 챕터 나누기
      for (let i = 0; i < allWords.length; i += 10) {
        chapters.push(allWords.slice(i, i + 10));
      }

      renderChapters();
      document.getElementById('total-count').innerText = `총 ${allWords.length}단어 / ${chapters.length}챕터`;
      document.getElementById('loading').style.display = 'none';
    } catch (e) {
      alert("데이터를 불러오지 못했습니다. vocab.csv 파일을 확인해주세요.");
    }
  }

  // 2. 챕터 리스트 그리기
  function renderChapters() {
    const list = document.getElementById('chapter-list');
    list.innerHTML = chapters.map((ch, idx) => `
      <div class="chapter-card" onclick="startChapter(${idx})">
        <div class="chapter-num">${idx + 1}</div>
        <div class="chapter-info">단어 ${ch.length}개</div>
      </div>
    `).join('');
  }

  function startChapter(idx) {
    currentChapterIdx = idx;
    currentIndex = 0;
    // 사운드 권한을 얻기 위해 빈 소리 한번 재생 (모바일 필수)
    currentAudio.play().catch(() => {}); 
    showScreen('screen-study');
    updateCard();
  }

  // 3. 오디오 재생 (에러 핸들링 강화)
  function playAudio(wordText, callback) {
    const fileName = wordText.toLowerCase().replace(/[^a-z0-9]/g, '');
    currentAudio.src = `./audio/${fileName}.mp3`;
    
    currentAudio.play()
      .then(() => { if(callback) currentAudio.onended = callback; })
      .catch(e => {
        console.warn("재생 실패:", fileName);
        if(callback) setTimeout(callback, 1500); // 파일 없으면 1.5초 후 다음으로
      });
  }

  function updateCard() {
    const word = chapters[currentChapterIdx][currentIndex];
    document.getElementById('word-en').innerText = word.word;
    document.getElementById('word-ko').innerText = word.meaning;
    document.getElementById('word-desc').innerText = word.desc;
    document.getElementById('word-progress').innerText = `${currentIndex + 1} / ${chapters[currentChapterIdx].length}`;
    isFlipped = false;
    document.getElementById('flashcard').classList.remove('flipped');
  }

  function toggleFlip() {
    isFlipped = !isFlipped;
    document.getElementById('flashcard').classList.toggle('flipped', isFlipped);
    if(isFlipped && !isPlaying) playAudio(chapters[currentChapterIdx][currentIndex].word);
  }

  function nextWord() {
    stopAutoPlay();
    currentIndex = (currentIndex + 1) % chapters[currentChapterIdx].length;
    updateCard();
  }

  function prevWord() {
    stopAutoPlay();
    currentIndex = (currentIndex - 1 + chapters[currentChapterIdx].length) % chapters[currentChapterIdx].length;
    updateCard();
  }

  // 4. 자동 재생 (루프)
  function runAutoStep() {
    if (!isPlaying) return;
    updateCard();
    playAudio(chapters[currentChapterIdx][currentIndex].word, () => {
      autoPlayTimeout = setTimeout(() => {
        if (!isPlaying) return;
        toggleFlip();
        autoPlayTimeout = setTimeout(() => {
          if (!isPlaying) return;
          currentIndex = (currentIndex + 1) % chapters[currentChapterIdx].length;
          runAutoStep();
        }, 2500);
      }, 800);
    });
  }

  function toggleAutoPlay() {
    isPlaying = !isPlaying;
    const btn = document.getElementById('btn-play-toggle');
    if (isPlaying) {
      btn.innerText = "⏹"; btn.style.background = "#333";
      runAutoStep();
    } else { stopAutoPlay(); }
  }

  function stopAutoPlay() {
    isPlaying = false;
    clearTimeout(autoPlayTimeout);
    currentAudio.pause();
    document.getElementById('btn-play-toggle').innerText = "▶";
    document.getElementById('btn-play-toggle').style.background = "#FF6B6B";
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
  }

  loadData();
</script>
</body>
</html>
